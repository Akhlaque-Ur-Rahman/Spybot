# Production stack for Hostinger Docker Manager (project name: spybot).
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Ingress (k8s) and Caddy reach the app on host port 3003.

name: spybot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spybot
      POSTGRES_PASSWORD: spybotpostgresql
      POSTGRES_DB: spybot
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spybot -d spybot']
      interval: 10s
      timeout: 5s
      retries: 5

  spybot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://spybot:spybotpostgresql@postgres:5432/spybot?schema=public
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      NODE_ENV: production
      PRISMA_PUSH_ON_BOOT: '0'
    ports:
      - '3003:3000'
    # CMS uploads land in /app/public/media. Without this bind, recreate/rebuild
    # drops files while MediaAsset rows and selected CMS srcs still point at them.
    volumes:
      - ./public/media:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: spybot_pgdata
