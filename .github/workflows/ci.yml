name: CI and deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# PRs: cancel superseded runs. Pushes to main: queue — avoids cancelling a deploy mid-rsync.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Next build runs Prisma during prerender; ephemeral Postgres only for CI (not your server).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-placeholder-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync database schema (for build prerender)
        run: pnpm db:push

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Cache Next.js compiler cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        run: pnpm build

  # Self-hosted runner (enable after: bash /opt/actions-runner-spybot/reinstall-spybot-runner.sh)
  deploy-self-hosted:
    needs: lint-test-build
    if: false
    runs-on: [self-hosted, spybot]
    timeout-minutes: 25
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: /srv/Spybot
    steps:
      - name: Sync repo and Docker deploy
        run: |
          set -euo pipefail
          git fetch origin main master 2>/dev/null || true
          git checkout -q main 2>/dev/null || git checkout -q master 2>/dev/null || true
          git pull --ff-only
          chmod +x deploy/scripts/deploy-docker.sh
          ./deploy/scripts/deploy-docker.sh

  # SSH deploy — SSH_PRIVATE_KEY must match /root/.ssh/id_ed25519 on VPS
  deploy-ssh:
    needs: lint-test-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Rsync to server and Docker deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::notice::Deploy skipped — add SSH_PRIVATE_KEY and DEPLOY_HOST secrets."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          KEYFILE="$HOME/.ssh/ci_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | sed $'1s/^\xef\xbb\xbf//' > "$KEYFILE"
          chmod 600 "$KEYFILE"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          USER="${DEPLOY_USER:-root}"
          REMOTE="${DEPLOY_PATH:-/srv/Spybot}"
          echo "Deploying to ${USER}@${DEPLOY_HOST}:${REMOTE}"
          SSH_OPTS="-i $KEYFILE -o IdentitiesOnly=yes -o BatchMode=yes"
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .env --exclude '.env.*' --exclude .git \
            -e "ssh $SSH_OPTS" ./ "${USER}@${DEPLOY_HOST}:${REMOTE}/"
          ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; cd \"${REMOTE}\"; chmod +x deploy/scripts/deploy-docker.sh; ./deploy/scripts/deploy-docker.sh"
          shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"
